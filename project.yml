name: SwitkoboRemote
options:
  bundleIdPrefix: com.switkobo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
packages:
  RemoteCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  SwitkoboRemote:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Switkobo Remote
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Connect directly to your Samsung TV on your home network and discover nearby TVs.
        NSBonjourServices:
          - _samsungmsf._tcp
          - _airplay._tcp
        NSMicrophoneUsageDescription: Use your microphone only when you choose to dictate text for your TV.
        NSSpeechRecognitionUsageDescription: Turn your voice into a text draft using on-device speech recognition.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.switkobo.remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: RemoteCore
  SwitkoboRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SwitkoboRemote
schemes:
  SwitkoboRemote:
    build:
      targets:
        SwitkoboRemote: all
        SwitkoboRemoteUITests: [test]
    test:
      targets: [SwitkoboRemoteUITests]
